<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Log</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f3f6">
<script>try{var t=localStorage.getItem("gymlog-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="description" content="Jeff Nippard's Upper/Lower program with your Runna runs, a set-by-set log and progress charts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Look: the Upper/Lower program's navy and steel blue with its condensed headings, set out like a phone app:
   soft rounded cards with no outlines, pill chips, a frosted tab bar. Light and dark versions; Auto follows the phone. */
:root {
  color-scheme: light;
  --bg: #f2f3f6;
  --panel: #ffffff;
  --panel-2: #eef0f4;
  --line: #e6e8ee;
  --line-2: #d3d7e0;
  --ink: #12172e;
  --title: #12172e;
  --muted: #646b7a;
  --faint: #a2a8b3;
  --accent: #2d5b7b;
  --accent-fill: #2d5b7b;
  --on-accent: #ffffff;
  --btn: #12172e;
  --on-btn: #ffffff;
  --soft: #e3ecf3;
  --hero-1: #346a8f; --hero-2: #1f3f5b;
  --bar: rgba(255,255,255,.82);
  --nav: rgba(242,243,246,.86);
  --shadow: 0 1px 2px rgba(18,23,46,.04), 0 6px 20px rgba(18,23,46,.06);
  --scrim: rgba(18,23,46,.4);
  --heat: var(--accent); --amber: var(--accent); --orange: var(--accent); --good: var(--accent); --blue: var(--accent);
  --red: #c0392b; --steel: #9a9da2;
  --d1: #2d5b7b; --d2: #12172e; --d3: #4f86ad; --d4: #4b5680; --d5: #86aac4; --d6: #6c6c7e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Nunito Sans", "Avenir Next", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --mono: "Barlow Semi Condensed", "DIN Alternate", "Arial Narrow", sans-serif;
  --r: 16px;
  --r-sm: 11px;
  --tabbar: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0d18; --panel: #141a2c; --panel-2: #1e2539; --line: #232a40; --line-2: #333b56;
    --ink: #eceff6; --title: #f3f5fa; --muted: #98a0b4; --faint: #5d6680;
    --accent: #7eb1d6; --accent-fill: #3a729b; --on-accent: #ffffff; --btn: #3a729b; --on-btn: #ffffff;
    --soft: #1b2d42; --hero-1: #2b5a7c; --hero-2: #17263f;
    --bar: rgba(20,26,44,.82); --nav: rgba(10,13,24,.84); --shadow: none; --scrim: rgba(0,0,0,.55);
    --red: #ef7a6d; --steel: #7b8096;
    --d1: #5b95bd; --d2: #c3cde0; --d3: #8fbfe0; --d4: #8b97c6; --d5: #a9c6dc; --d6: #9a9aae;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d18; --panel: #141a2c; --panel-2: #1e2539; --line: #232a40; --line-2: #333b56;
  --ink: #eceff6; --title: #f3f5fa; --muted: #98a0b4; --faint: #5d6680;
  --accent: #7eb1d6; --accent-fill: #3a729b; --on-accent: #ffffff; --btn: #3a729b; --on-btn: #ffffff;
  --soft: #1b2d42; --hero-1: #2b5a7c; --hero-2: #17263f;
  --bar: rgba(20,26,44,.82); --nav: rgba(10,13,24,.84); --shadow: none; --scrim: rgba(0,0,0,.55);
  --red: #ef7a6d; --steel: #7b8096;
  --d1: #5b95bd; --d2: #c3cde0; --d3: #8fbfe0; --d4: #8b97c6; --d5: #a9c6dc; --d6: #9a9aae;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); overflow-x: hidden; max-width: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--nav); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
button, input, textarea, select { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:active { opacity: .75; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--display); font-weight: 700; letter-spacing: .02em; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 28px); }
main .wrap { padding-block: 14px 0; }
section.view { display: grid; gap: 22px; }

.head { display: grid; gap: 2px; padding-top: 8px; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); }
.head h1 { font-size: 40px; line-height: 1.02; text-transform: uppercase; color: var(--title); letter-spacing: .03em; }
.head p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }
.label { font-size: 13px; font-weight: 800; letter-spacing: .02em; color: var(--muted); padding: 0 4px; display: flex; align-items: center; gap: 10px; }
.group { display: grid; gap: 8px; }
.note { font-size: 13px; color: var(--muted); padding: 0 4px; line-height: 1.5; margin: 0; }
.panel { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }

/* Hero: the program's steel-blue week pages, as a soft gradient card */
.hero { position: relative; overflow: hidden; padding: 20px 18px 18px; display: grid; gap: 18px; background: linear-gradient(145deg, var(--hero-1), var(--hero-2)); color: #fff; border-radius: 22px; box-shadow: var(--shadow); }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.06); pointer-events: none; }
.hero-top { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center; position: relative; z-index: 1; }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; }
.ring .big { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1; }
.ring .cap { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.7); margin-top: 3px; }
.hero .when { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.72); }
.hero h2 { font-size: 38px; line-height: 1; margin-top: 2px; text-transform: uppercase; color: #fff; letter-spacing: .04em; }
.hero .sub { color: rgba(255,255,255,.85); font-size: 14px; margin: 6px 0 0; }
.telemetry { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.telemetry div { padding: 10px 12px; display: grid; gap: 1px; min-width: 0; border-radius: var(--r-sm); background: var(--panel-2); }
.hero .telemetry { position: relative; z-index: 1; }
.hero .telemetry div { background: rgba(255,255,255,.1); }
.telemetry .k { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.hero .telemetry .k { color: rgba(255,255,255,.7); }
.telemetry .v { font-family: var(--display); font-size: 25px; font-weight: 700; line-height: 1.1; }
.telemetry .v small { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.hero .telemetry .v small { color: rgba(255,255,255,.7); }
.cta { display: block; width: 100%; text-align: center; border: 0; border-radius: 14px; padding: 15px; background: var(--btn); color: var(--on-btn); font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; position: relative; z-index: 1; }
.cta.quiet { background: var(--panel); color: var(--accent); box-shadow: var(--shadow); }
.hero .cta { background: #fff; color: #12172e; }
.hero .cta.quiet { background: rgba(255,255,255,.14); color: #fff; box-shadow: none; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; z-index: 1; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 10px 6px; background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); }
.wd { display: grid; gap: 4px; justify-items: center; padding: 6px 0; border-radius: 12px; background: none; border: 0; text-align: center; color: inherit; }
.wd .d { font-size: 11px; font-weight: 700; color: var(--muted); }
.wd .n { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.wd .t { font-size: 10px; font-weight: 700; color: var(--muted); line-height: 1.1; }
.wd .bar { width: 6px; height: 6px; border-radius: 50%; background: var(--c, transparent); opacity: .35; }
.wd.done .bar { opacity: 1; }
.weeknav { display: flex; align-items: center; gap: 8px; }
.navbtn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--panel); box-shadow: var(--shadow); font-size: 18px; line-height: 1; color: var(--accent); }
button.wd { cursor: pointer; }
.wd.done .n { background: var(--panel-2); }
.wd.today .n { background: var(--btn); color: var(--on-btn); }

/* Lists */
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 0; background: none; text-align: left; width: 100%; text-decoration: none; color: inherit; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.row .stripe { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.row .main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.row .t1 { font-weight: 700; }
.row .t2 { font-size: 13px; color: var(--muted); }
.row .end { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--muted); text-align: right; flex: none; }
.chev { color: var(--faint); font-size: 18px; flex: none; }

/* Workout header: a frosted bar like an app's navigation bar */
.wohead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--nav); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--ink); }
.wohead .wrap { display: grid; gap: 8px; padding-block: 8px 12px; }
.wotop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 0; font-size: 16px; }
.clock { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.wotitle { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.wotitle h1 { font-size: 34px; text-transform: uppercase; line-height: 1; color: var(--title) !important; letter-spacing: .03em; }
.wotitle .num { color: var(--muted) !important; }
.prog { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 3px; background: var(--accent-fill); transition: width .3s; }
.dateline { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.dateline input { background: var(--panel); border: 0; border-radius: 10px; padding: 6px 10px; box-shadow: var(--shadow); }

.ex { padding: 16px; display: grid; gap: 12px; overflow: hidden; }
.ex > *:not(.exhead) { margin-inline: 0; }
.ex.complete { box-shadow: var(--shadow), inset 0 0 0 1.5px var(--accent-fill); }
.exhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.exidx { font-size: 12px; font-weight: 700; color: var(--accent); }
.exname { font-size: 24px; line-height: 1.05; margin-top: 2px; text-transform: uppercase; letter-spacing: .03em; color: var(--title); }
.panel .prose .exname, .prose .exname { color: var(--title); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 13.5px; padding: 4px 11px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.chip b { color: var(--ink); font-weight: 700; }
.chip.good { color: var(--on-accent); background: var(--accent-fill); }
.chip.good b { color: inherit; }
.swap { flex: none; border: 0; background: var(--panel-2); color: var(--accent); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.swap svg { width: 14px; height: 14px; }
.prev { font-size: 13px; color: var(--muted); }
.prev b { color: var(--ink); font-family: var(--mono); font-weight: 600; font-size: 14px; }
.sets { display: grid; gap: 8px; }
.setrow, .sethead { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 46px; gap: 8px; align-items: center; }
.sethead span { font-size: 11.5px; font-weight: 700; color: var(--faint); }
.setno { font-family: var(--display); font-size: 19px; font-weight: 700; color: var(--faint); text-align: center; }
.setrow input { width: 100%; min-width: 0; background: var(--panel-2); border: 1.5px solid transparent; border-radius: 12px; padding: 9px; font-family: var(--mono); font-size: 20px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.setrow input::placeholder { color: var(--faint); font-weight: 500; }
.setrow input:focus { background: var(--panel); border-color: var(--accent); outline: none; }
.setrow.on input { background: var(--soft); }
.setrow.on .setno { color: var(--accent); }
.tick { height: 46px; border-radius: 50%; border: 0; background: var(--panel-2); display: grid; place-items: center; color: var(--faint); }
.tick svg { width: 20px; height: 20px; }
.tick[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); }
.mini { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ghost { border: 0; background: var(--panel-2); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 700; color: var(--accent); }
details.cue summary { font-size: 13px; color: var(--muted); cursor: pointer; list-style: none; }
details.cue summary::-webkit-details-marker { display: none; }
details.cue summary::before { content: "+ "; color: var(--accent); font-weight: 700; }
details.cue[open] summary::before { content: "– "; }
details.cue p { margin: 6px 0 0; font-size: 14px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; min-width: 0; background: var(--panel-2); border: 1.5px solid transparent; border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
.field input { font-family: var(--mono); font-weight: 600; }
textarea { resize: vertical; min-height: 70px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.watch { font-size: 13.5px; font-weight: 700; color: var(--accent); text-decoration: none; }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); justify-self: center; }
.sheet h3 { font-size: 26px; text-transform: uppercase; color: var(--title); }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--panel); border-radius: 14px; padding: 14px 16px; font-weight: 600; box-shadow: var(--shadow); }
.opt[aria-pressed="true"] { box-shadow: var(--shadow), inset 0 0 0 2px var(--accent-fill); }
.opt .eq { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.opts { display: grid; gap: 8px; }

/* Rest timer: a floating card */
.rest { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 50; padding: 12px 14px; background: #12172e; color: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: 540px; margin: 0 auto; }
:root[data-theme="dark"] .rest { background: #26304c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rest { background: #26304c; } }
.rest .wrap { display: flex; align-items: center; gap: 12px; padding: 0; }
.rest .tt { font-family: var(--display); font-size: 36px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 80px; }
.rest .tl { flex: 1; min-width: 0; font-size: 12px; color: rgba(255,255,255,.7); display: grid; gap: 6px; }
.rest .tl span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest .prog { background: rgba(255,255,255,.18); }
.rest .prog i { background: #fff; }
.rest.over .tt { color: #9cc3df; }
.rest button { border: 0; background: rgba(255,255,255,.14); color: #fff; border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: 13px; }

/* Tab bar: frosted, like a native one */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bar); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); border-top: .5px solid var(--line-2); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tabbar button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--faint); font-size: 10.5px; font-weight: 700; position: relative; }
.tabbar svg { width: 23px; height: 23px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* History + chart */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.select { width: 100%; background: var(--panel-2); border: 0; border-radius: 12px; padding: 11px 12px; font-size: 15px; }
.hitem { padding: 14px 16px 14px 20px; display: grid; gap: 8px; box-shadow: var(--shadow), inset 4px 0 0 var(--c); }
.hitem header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hitem h4 { font-size: 22px; text-transform: uppercase; color: var(--title); }
.hitem time { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.hitem ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; }
.hitem ul span { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.hbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.sbtn { border: 0; background: var(--panel-2); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 700; color: var(--accent); }
.sbtn.danger { color: var(--red); }
.empty { text-align: center; color: var(--muted); padding: 34px 16px; border-radius: var(--r); font-size: 14px; background: var(--panel); box-shadow: var(--shadow); }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 13px; border-radius: 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #39425f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #39425f; } }
.setline { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; }
.setline + .setline { border-top: 1px solid var(--line); }
.setline select { background: var(--panel-2); border: 0; border-radius: 10px; padding: 6px 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 14px); z-index: 70; background: #12172e; color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.prose { display: grid; gap: 8px; }

// the last one you logged, so a missed day simply pushes everything along. Skip and "Start from here"

const order = () => SPLITS[S.prog.split] || SPLITS[6];

function nextPos() {
  if (memo.next !== undefined) return memo.next;
  const last = Object.values(S.sessions).filter(s => s.wk && isLogged(s)).sort((a, b) => (b.start || 0) - (a.start || 0))[0];
  const c = S.prog.cursor;
  return memo.next = c && (!last || c.at > (last.start || 0)) ? posOf(c.wk, c.d) : last ? posOf(last.wk, dnum(last.day)) + 1 : 0;
}
// Upcoming program sessions laid onto your lift days, starting today (or tomorrow if today's is done).

  const doneToday = sessionsOn(today).some(s => s.wk);
  let p = nextPos();
  for (let k = 0; k < 42 && p < seqLen(); k++) {
    const dd = addDays(today, k);

}
const nextLabel = () => { const e = Object.entries(upcoming())[0]; return e ? `Wk ${e[1].wk} · ${dayOf(e[1].d).name}` : "–"; };

// ================= Loads =================
const step = () => S.unit === "lb" ? 5 : 2.5;

// Best estimated max from your log in the last 12 weeks, for the plain version of the lift.

    const e = s.ex?.[id]; if (!e || e.v !== name || s.date < from) continue;

// The program's %1RM warm-up pyramid for primary lifts.

// The 5K: set in Setup, or the last "5k" session in the Runna plan.

  return k[k.length - 1] || null;
}
const runLog = () => Object.values(S.sessions).filter(s => byId(s.day).run && num(s.dist) > 0 && num(s.time) > 0).sort((a, b) => a.date.localeCompare(b.date));
const fmtClock = min => { const t = Math.round(min * 60), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };

  if (!hasProg()) return `<section class="view"><div class="head"><div class="eyebrow">Plan</div><h1>Upper / Lower</h1></div>${importCard()}</section>`;
  const cur = atPos(Math.min(nextPos(), seqLen() - 1)), wk = planWk || cur.wk;
  const days = order().map(dn => { const d = dayOf(dn), ex = dayPlanEx(wk, dn), here = cur.wk === wk && cur.d === dn;
    return `<details class="panel" style="--c:var(${d.c})" ${here ? "open" : ""}>
      <summary class="row" style="cursor:pointer;list-style:none"><span class="stripe"></span><span class="main"><span class="t1" style="font-family:var(--display);font-size:21px;text-transform:uppercase;font-weight:700">${esc(d.name)}${here ? ` <span class="chip good" style="font-family:var(--mono);font-size:10px;vertical-align:middle">next</span>` : ""}</span><span class="t2">${esc(d.focus)}</span></span><span class="end">${totalSets(ex)} sets</span><span class="chev">⌄</span></summary>
      <div class="rows" style="border-top:1px solid var(--line)">${ex.map(x => { const v = variantOf(x);
        return `<div class="row"><span class="main"><span class="t1">${x.ss ? x.ss + " · " : ""}${esc(v)}</span><span class="t2">${x.pct ? `${esc(x.load)} 1RM${targetW(x) && v === x.name ? ` (${fmtW(targetW(x))} ${esc(S.unit)})` : ""}` : `RPE ${esc(x.load)}`} · rest ${fmtRest(x.rest)}</span></span><span class="end">${esc(x.setsTxt.replace("-", "–"))}×${esc(x.reps.replace("-", "–"))}</span></div>`; }).join("")}
        <button class="row" type="button" data-act="preview" data-day="${d.id}" data-wk="${wk}" style="color:var(--amber);font-weight:700"><span class="main">Open ${esc(d.name)}, week ${wk}</span><span class="chev">›</span></button></div>
    </details>`; }).join("");
  return `<section class="view">
    <div class="head"><div class="eyebrow">${S.prog.split} lifts a week · 9 weeks · plus Runna</div><h1>Upper / Lower</h1><p>${esc(PROG_NAME || "Your program")}. Three 3-week waves: an easier week, a harder one, then the hardest, and the loads step up each wave.</p></div>
    <div class="seg" role="group" aria-label="Week" style="display:grid;grid-template-columns:repeat(9,1fr)">${Array.from({ length: WEEKS }, (_, i) => `<button type="button" data-act="planwk" data-w="${i + 1}" aria-pressed="${i + 1 === wk}" style="padding:6px 0">${i + 1}</button>`).join("")}</div>
    <p class="note">Week ${wk} · wave ${WAVE(wk)}. ${esc(waveNote(wk))}${S.prog.split != 6 ? " " + esc(SPLIT_TXT[S.prog.split]) : ""}</p>
    <div class="group">${days}</div>
    <div class="group"><div class="label">How hard to go</div><div class="panel pad prose"><ul>
      <li><b>% lifts</b> (squat, bench, deadlift and friends) use a set share of your one-rep max. Add your maxes in Setup and the app works out the weight, rounded to the nearest ${step()} ${esc(S.unit)}.</li>
      <li><b>RPE</b> is effort out of 10. RPE 8 leaves about 2 reps in the tank, RPE 9 one, RPE 10 none.</li>
      <li><b>Last-set RPE.</b> After your final set, note how hard it really was. It shows whether you're matching the target.</li>
      <li>Weeks 1, 4 and 7 are mini-deloads. Don't push them harder than written.</li></ul></div></div>
    <div class="group"><div class="label">How it progresses</div><div class="panel pad prose"><ul>
      <li>Primary lifts add a rep each week of a wave, then drop back to the low end with about 2.5% more of your max at the start of the next wave. Your max stays the same, the percentages climb.</li>
      <li>On RPE lifts, add weight when the target RPE starts to feel easier than written.</li>
      <li>Slow and steady on the big lifts with perfect form. Push harder and have fun on the smaller ones.</li></ul></div></div>
    <div class="group"><div class="label">Techniques</div><div class="panel pad prose"><ul>
      <li><b>A1 / A2</b> is a superset: do A1, go straight into A2, then rest.</li>
      <li><b>12/12 dropset:</b> 12 reps, drop the weight, 12 more. <b>21s:</b> 7 partial reps in one half, 7 in the other, 7 full.</li>
      <li><b>AMRAP/2:</b> as many reps as you can at the RPE, then 2 slow, assisted negatives. <b>Myo-reps:</b> 8 reps, rest 5 s, 2 reps, rest 5 s, 2 reps.</li>
      <li><b>Weak point:</b> pick 2–3 lagging body parts before you start and use one exercise for them on every weak-point slot.</li></ul></div></div>
    <div class="group"><div class="label">Warm-up before every session</div><div class="panel pad">${warmupTable()}</div></div>
    <p class="note">Video links are the ones in the program where it has one.</p>
  </section>`;
}

// ================= Progress =================
function historyView() {
  const all = sessionsList().filter(isLogged);
  if (!all.length) return `<section class="view"><div class="head"><div class="eyebrow">Progress</div><h1>Your log</h1></div>
    <div class="empty">Finished workouts and runs show up here, with a chart for each lift.<br><br>Start today's session from the Today tab. Every set saves as you type.</div></section>`;
  const exMap = new Map();
  for (const s of all) for (const e of Object.values(s.ex || {})) if (e.sets.some(x => num(x.w) && num(x.r))) exMap.set(e.v, true);
  const names = [...exMap.keys()].sort();
  if (!histEx || !exMap.has(histEx)) histEx = names[0] || null;
  const totalVol = all.reduce((n, s) => n + sessionVolume(s), 0);
  const lifts = all.filter(s => !byId(s.day).run).length;
  const runs = all.filter(s => byId(s.day).run);
  const km = runs.reduce((n, s) => n + num(s.dist), 0);
  const list = all.slice(0, histMore).map(s => {
    const d = byId(s.day); let body;
    if (d.run) body = `<ul><li>${esc(s.variant || "")} <span>${s.dist ? esc(s.dist) + " km" : ""}${s.time ? " · " + esc(s.time) + " min" : ""}${s.dist && s.time ? " · " + paceText(s).replace("Pace ", "") : ""}</span></li></ul>`;
    else body = `<ul>${Object.values(s.ex || {}).filter(e => e.sets.some(filled)).map(e => `<li>${esc(e.v)} <span>${e.sets.filter(filled).map(x => `${esc(x.w || "–")}×${esc(x.r || "–")}`).join(" ")}</span></li>`).join("") || "<li><span>No sets entered</span></li>"}</ul>`;
    const del = pendingDel.has(s.id);
    return `<article class="panel hitem" style="--c:var(${d.c})"><header><h4>${esc(d.run ? d.name : sessName(s))}</h4><time>${fmtDate(s.date)}</time></header>${body}${s.note ? `<p class="note" style="padding:0">${esc(s.note)}</p>` : ""}
      <div class="hbtns"><button class="sbtn" type="button" data-act="open" data-id="${s.id}">Open</button>${del ? `<button class="sbtn danger" type="button" data-act="delyes" data-id="${s.id}">Yes, delete</button><button class="sbtn" type="button" data-act="delno" data-id="${s.id}">Keep</button>` : `<button class="sbtn danger" type="button" data-act="del" data-id="${s.id}">Delete</button>`}</div></article>`;
  }).join("");
  const pos = nextPos(), total = seqLen();
  return `<section class="view">
    <div class="head"><div class="eyebrow">Progress</div><h1>Your log</h1></div>
    <div class="panel pad"><div class="telemetry" style="border:0"><div><span class="k">Workouts</span><span class="v">${lifts}</span></div><div><span class="k">Lifted</span><span class="v">${fmtK(totalVol)}<small>${S.unit}</small></span></div><div><span class="k">Ran</span><span class="v">${km.toFixed(1)}<small>km</small></span></div></div></div>
    ${hasProg() ? `<div class="group"><div class="label">Upper/Lower program</div><div class="panel pad" style="display:grid;gap:8px"><div class="prog"><i style="width:${Math.min(100, pos / total * 100)}%"></i></div>
      <p class="note" style="padding:0">${Math.min(pos, total)} of ${total} sessions${pos < total ? `. Next: week ${atPos(pos).wk}, ${esc(dayOf(atPos(pos).d).name)}.` : ". Program finished."}</p></div></div>` : ""}
    ${bwPanel()}
    ${names.length ? `<div class="group"><div class="label">Strength trend</div><div class="panel pad" style="display:grid;gap:12px">
      <select class="select" id="hist-ex" aria-label="Exercise">${names.map(n => `<option ${n === histEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      ${chart(histEx)}</div></div>` : ""}
    ${runningPanel()}
    <div class="group"><div class="label">Last 12 weeks</div>${heatmap(all)}</div>
    <div class="group"><div class="label">Sessions</div>${list}
      ${all.length > histMore ? `<button class="cta quiet" type="button" data-act="more">Show ${Math.min(10, all.length - histMore)} more</button>` : ""}</div>
  </section>`;
}
// Best estimated 1RM per session for one variation.
function series(name) {
  return memo["s:" + name] ||= Object.values(S.sessions).map(s => {
    const e = Object.values(s.ex || {}).find(e => e.v === name); if (!e) return null;
    let best = 0, top = null;
    for (const x of e.sets) { const v = e1rm(num(x.w), num(x.r)); if (v > best) { best = v; top = x; } }
    return best ? { date: s.date, v: best, top } : null;
  }).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
}
// One square per day, coloured by what you trained. Tap a day to open it.
function heatmap(all) {
  const by = {};
  for (const s of all) (by[s.date] ||= []).push(s);
  const start = addDays(iso(weekStart()), -77), today = todayISO();
  let lifts = 0, runs = 0;
  const cells = Array.from({ length: 84 }, (_, i) => {
    const dd = addDays(start, i), ss = by[dd] || [], d = ss[0] && byId(ss[0].day);
    if (dd > today) return `<span class="hm future"></span>`;
    for (const s of ss) byId(s.day).run ? runs++ : lifts++;
    return `<button type="button" class="hm ${ss.length ? "on" : ""} ${dd === today ? "now" : ""}" data-act="day" data-date="${dd}" style="--c:${d ? `var(${d.c})` : "transparent"}" aria-label="${fmtDate(dd)}${ss.length ? ": " + ss.map(s => byId(s.day).name).join(", ") : ""}">${ss.length > 1 ? "<i></i>" : ""}</button>`;
  }).join("");
  return `<div class="panel pad" style="display:grid;gap:10px"><div class="hmgrid">${WD.map(w => `<span class="hmd">${w[0]}</span>`).join("")}${cells}</div>
    <p class="note" style="padding:0">${lifts} lift${lifts === 1 ? "" : "s"} and ${runs} run${runs === 1 ? "" : "s"} in 12 weeks. Each row is a week, colours match the training day. Tap a day to open it.</p></div>`;
}
function chart(name) {
  const pts = series(name);
  if (!pts.length) return `<p class="note">No weights logged for this one yet.</p>`;
  const last = pts[pts.length - 1], first = pts[0], change = last.v - first.v;
  return `${lineChart(pts, { fmt: v => String(Math.round(v)), label: `Estimated one-rep max for ${name} over time` })}
    <p class="note" style="padding:0">Estimated one-rep max from your best set each session. Latest: <b style="color:var(--ink)">${Math.round(last.v)}</b> from ${esc(last.top.w)}×${esc(last.top.r)}${pts.length > 1 ? `, <span style="color:${change >= 0 ? "var(--good)" : "var(--red)"}">${change >= 0 ? "+" : ""}${change.toFixed(1)}</span> since ${fmtDate(first.date)}` : ""}.</p>`;
}
// Line chart of { date, v } points. invert puts low values on top (for pace).
function lineChart(pts, { fmt, invert, label }) {
  const W = 320, H = 150, L = 38, R = 10, T = 12, B = 22;
  const lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = Math.max((hi - lo) * 0.15, hi * 0.04, 0.1), y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => { const f = (v - y0) / (y1 - y0); return T + (invert ? f : 1 - f) * (H - T - B); };
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length - 1).toFixed(1)},${H - B}L${x(0).toFixed(1)},${H - B}Z`;
  const ticks = [y0, (y0 + y1) / 2, y1].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join("");
  const last = pts[pts.length - 1], first = pts[0];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.25"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--title)"/></linearGradient></defs>
    ${ticks}${invert ? "" : `<path d="${area}" fill="url(#ag)"/>`}<path d="${line}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 2.5}" style="fill:${i === pts.length - 1 ? "var(--title)" : "var(--panel)"};stroke:var(--accent)" stroke-width="1.5"/>`).join("")}
    <text x="${L}" y="${H - 6}">${fmtDate(first.date)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(last.date)}</text></svg>`;
}

// ================= Bottom sheet =================
function sheet(html) {
  document.getElementById("layer").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
}
function closeSheet() { document.getElementById("layer").innerHTML = ""; }
const exById = (dayId, exId, s) => (s ? planFor(s).ex : DAYDEF.find(d => d.id === dayId) ? PROG.map(w => w[dnum(dayId) - 1]).flat().map(exOf) : []).find(e => e.id === exId);
function swapSheet(s, exId, dayId) {
  const ex = exById(dayId, exId, s); if (!ex) return;
  const cur = s?.ex[exId]?.v || variantOf(ex);
  const opt = (n, tag) => `<button class="opt" type="button" data-act="pick" data-ex="${exId}" data-day="${dayId}" data-name="${esc(n)}" aria-pressed="${n === cur}"><span style="flex:1;min-width:0">${esc(n)}</span><span class="eq">${esc(tag)}</span></button>`;
  const body = ex.wp ? WEAK[ex.wp].map(([part, list]) => `<div class="label">${esc(part)}</div><div class="opts">${list.map(n => opt(n, part)).join("")}</div>`).join("")
    : `<div class="opts">${[[ex.name, "Program"], ...ex.swaps.map(n => [n, "Swap"])].map(([n, t]) => opt(n, t)).join("")}</div>`;
  sheet(`<h3>${ex.wp ? `${ex.wp === "upper" ? "Upper" : "Lower"} body weak point` : "Swap exercise"}</h3><p class="note" style="padding:0">${ex.wp ? "Pick one exercise for the body part you most want to bring up. It's used on every weak-point slot until you change it." : "The program's own substitutes. Your choice sticks for future workouts, and each variation keeps its own history."}</p>
    ${body}<button class="cta quiet" type="button" data-act="closesheet">Cancel</button>`);
}

// ================= Rest timer =================
let rEnd = 0, rLen = 0, rInt = null, beeped = false, audio = null;
function startRest(sec, label) {
  rEnd = Date.now() + sec * 1000; rLen = sec * 1000; beeped = false;
  document.getElementById("rest-l").textContent = "Rest · next set of " + label;
  document.getElementById("rest").hidden = false;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
  clearInterval(rInt); restTick(); rInt = setInterval(restTick, 250);
}
function stopRest() { clearInterval(rInt); document.getElementById("rest").hidden = true; }
function restTick() {
  const left = Math.round((rEnd - Date.now()) / 1000), a = Math.abs(left);
  document.getElementById("rest-t").textContent = (left < 0 ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");
  document.getElementById("rest").classList.toggle("over", left < 0);
  document.getElementById("rest-bar").style.width = Math.min(100, Math.max(0, 100 - (rEnd - Date.now()) / rLen * 100)) + "%";
  if (left <= 0 && !beeped) { beeped = true; beep(); try { navigator.vibrate?.([200, 100, 200]); } catch {} }
}
function beep() {
  if (!audio) return;
  try { [0, .25].forEach(t => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, audio.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t + .18); o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2); }); } catch {}
}
document.getElementById("rest-add").onclick = () => { rEnd += 30000; rLen += 30000; beeped = false; restTick(); };
document.getElementById("rest-skip").onclick = stopRest;
function tickClock() {
  const c = document.getElementById("clock"); if (!c || !open) return;
  const s = S.sessions[open]; if (!s || byId(s.day).run) return;
  if (s.end) { c.textContent = fmtDate(s.date); return; }
  const m = Math.floor((Date.now() - s.start) / 60000);
  c.textContent = m > 600 ? fmtDate(s.date) : `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} elapsed`;
}
setInterval(tickClock, 15000);

// ================= Events =================
function saveMax(id, v) {
  v = String(v ?? "").trim().replace(",", ".");
  if (num(v) > 0) S.maxes[id] = String(num(v)); else delete S.maxes[id];
  save(true);
}
document.addEventListener("click", ev => {
  if (ev.target.id === "scrim") return closeSheet();
  const b = ev.target.closest("[data-tab],[data-act]"); if (!b) return;
  if (b.dataset.tab) return go(b.dataset.tab);
  const a = b.dataset.act, s = open && S.sessions[open];
  switch (a) {
    case "start": closeSheet(); return startSession(b.dataset.day, b.dataset.date, b.dataset.wk);
    case "runnamove": {
      const mv = S.runnaMoves || (S.runnaMoves = {}), r = RUNNA?.all[b.dataset.id];
      if (b.dataset.to) mv[b.dataset.id] = b.dataset.to; else delete mv[b.dataset.id];
      save(); toast(!b.dataset.to ? `Back on ${r ? fmtDate(r.date) : "its day"}.` : "Moved to today. Log it here when you're done.");
      preview = b.dataset.to ? { day: "runna", date: b.dataset.to } : null;
      render(); return window.scrollTo(0, 0);
    }
    case "preview": closeSheet(); preview = { day: b.dataset.day, wk: b.dataset.wk, date: b.dataset.date || todayISO() }; render(); return window.scrollTo(0, 0);
    case "unpreview": preview = null; render(); return window.scrollTo(0, 0);
    case "day": return openDay(b.dataset.date);
    case "wk": ev.preventDefault(); weekOff = +b.dataset.d === 0 ? 0 : weekOff + +b.dataset.d; return render();
    case "resume": open = S.active; render(); return window.scrollTo(0, 0);
    case "others": return othersSheet();
    case "skip": {
      ev.preventDefault();
      const n = atPos(nextPos()), nx = atPos(nextPos() + 1);
      if (nextPos() + 1 >= seqLen()) S.prog.cursor = { wk: WEEKS + 1, d: order()[0], at: Date.now() }; else setCursor(nx.wk, nx.d);
      save(true); toast(`${dayOf(n.d).name} skipped. Next is ${nextPos() < seqLen() ? dayOf(nx.d).name : "the end of the program"}.`); return render();
    }
    case "cursor": setCursor(+b.dataset.wk, +b.dataset.d); preview = null; toast(`Next workout: week ${b.dataset.wk}, ${dayOf(+b.dataset.d).name}`); render(); return window.scrollTo(0, 0);
    case "jump": { const w = +document.getElementById("jump-wk").value, d = +document.getElementById("jump-d").value; setCursor(w, d); toast(`Next workout: week ${w}, ${dayOf(d).name}`); return render(); }
    case "restart": setCursor(1, order()[0]); toast("Back to Week 1. Update your maxes in Setup first."); return render();
    case "planwk": planWk = +b.dataset.w; return render();
    case "focus": S.prog.focus = +b.dataset.v; save(true); return render();
    case "split": S.prog.split = +b.dataset.v; S.prog.days = SPLIT_DAYS[S.prog.split].slice(); { const c = S.prog.cursor; if (c && !order().includes(c.d)) c.d = order()[0]; } save(true); return render();
    case "liftday": S.prog.days[+b.dataset.i] = S.prog.days[+b.dataset.i] ? 0 : 1; save(true); return render();
    case "maxsave": { const inp = document.getElementById("max-" + b.dataset.ex); saveMax(b.dataset.id, inp?.value.trim() || inp?.placeholder); toast(maxFor(b.dataset.ex) ? "Saved. Weights worked out." : "Cleared"); return render(); }
    case "bwsave": {
      const v = (document.querySelector(".sheet #bw-in") || document.getElementById("bw-in"))?.value.trim().replace(",", ".");
      S.bw ||= {};
      if (num(v) > 0) S.bw[todayISO()] = String(num(v)); else delete S.bw[todayISO()];
      save(true); closeSheet(); toast(num(v) > 0 ? `Saved ${num(v)} ${S.unit}` : "Weigh-in removed"); return render();
    }
    case "more": histMore += 10; return render();
    case "open": closeSheet(); open = b.dataset.id; render(); return window.scrollTo(0, 0);
    case "close": stopRest(); open = null; preview = null; save(true); render(); return window.scrollTo(0, 0);
    case "finish": return finish(s);
    case "closesheet": return closeSheet();
    case "closesheet-home": closeSheet(); open = null; tab = "today"; render(); return window.scrollTo(0, 0);
    case "swap": return swapSheet(s, b.dataset.ex, b.dataset.day);
    case "pick": {
      const ex = exById(b.dataset.day, b.dataset.ex, s), n = b.dataset.name;
      if (n === ex.name) delete S.swaps[ex.id]; else S.swaps[ex.id] = n;
      if (s && !s.end) exEntry(s, ex.id).v = n;
      save(); closeSheet(); render(); toast((ex.wp ? "Weak point: " : "Swapped to ") + n); return;
    }
    case "tick": {
      const e = exEntry(s, b.dataset.ex), k = +b.dataset.k, x = e.sets[k] || (e.sets[k] = {});
      x.done = !x.done;
      if (x.done) {
        const w = document.getElementById(`w-${b.dataset.ex}-${k}`), r = document.getElementById(`r-${b.dataset.ex}-${k}`);
        if (!filled({ w: x.w }) && w.placeholder !== "–") { x.w = w.placeholder; w.value = x.w; }
        if (!x.r && /^\d+$/.test(r.placeholder)) { x.r = r.placeholder; r.value = x.r; }
        const ex = planFor(s).ex.find(q => q.id === b.dataset.ex);
        if (!s.end) { if (ex.rest[0] > 0) startRest(ex.rest[0], e.v); else toast(`Straight into the next exercise (superset), then rest`); }
      }
      b.setAttribute("aria-pressed", x.done); b.closest(".setrow").classList.toggle("on", x.done);
      b.closest(".ex").classList.toggle("complete", e.sets.every(q => q.done));
      refreshProgress(s); save(); return;
    }
    case "addset": { const e = exEntry(s, b.dataset.ex); const prev = e.sets[e.sets.length - 1] || {}; e.sets.push({ w: prev.w || "" }); save(); return render(); }
    case "rmset": { const e = exEntry(s, b.dataset.ex); e.sets.pop(); save(); return render(); }
    case "del": pendingDel.add(b.dataset.id); return render();
    case "delno": pendingDel.delete(b.dataset.id); return render();
    case "delyes": if (S.active === b.dataset.id) S.active = null; delete S.sessions[b.dataset.id]; pendingDel.delete(b.dataset.id); save(true); toast("Deleted"); return render();
    case "theme": setTheme(b.dataset.t); return render();
    case "unit": S.unit = b.dataset.u; if (S.active && S.sessions[S.active] && !doneSets(S.sessions[S.active])) S.sessions[S.active].unit = S.unit; save(); return render();
    case "resetswaps": S.swaps = {}; save(); toast("Back to the program's exercises"); return render();
    case "export": {
      const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
      const file = new File([blob], `gym-log-${todayISO()}.json`, { type: "application/json" });
      if (navigator.canShare?.({ files: [file] })) { navigator.share({ files: [file], title: "Gym Log backup" }).catch(() => {}); return; }
      const u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = file.name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return;
    }
    case "runs": go("history"); return document.getElementById("running")?.scrollIntoView({ block: "start" });
    case "rmetric": runMetric = b.dataset.m; return render();
    case "wipe": pendingDel.add("ALL"); return render();
    case "wipeno": pendingDel.delete("ALL"); return render();
    case "wipeyes": S = tidy({ program: S.program }); pendingDel.delete("ALL"); save(true); toast("Everything erased"); return render();
  }
});
document.addEventListener("input", ev => {
  const el = ev.target, s = open && S.sessions[open];
  if (s && el.dataset.f) {
    const e = exEntry(s, el.dataset.ex), k = +el.dataset.k;
    (e.sets[k] || (e.sets[k] = {}))[el.dataset.f] = el.value.trim().replace(",", ".");
    return save();
  }
  if (s && el.dataset.ls) { exEntry(s, el.dataset.ls).ls = el.value.trim().replace(",", "."); return save(); }
  if (s && el.dataset.run) { s[el.dataset.run] = el.value; const p = document.getElementById("pace"); if (p) p.textContent = paceText(s); return save(); }
  if (s && el.id === "wo-note") { s.note = el.value; return save(); }
});
document.addEventListener("change", ev => {
  const el = ev.target, s = open && S.sessions[open];
  if (s && el.id === "wo-date" && el.value) { s.date = el.value; save(); return; }
  if (el.dataset.max && el.id.startsWith("mx-")) { saveMax(el.dataset.max, el.value); return; }
  if (el.id === "hist-ex") { histEx = el.value; return render(); }
  if (el.id === "race-date") { if (el.value) S.race = el.value; else delete S.race; save(); return render(); }
  if ((el.id === "import" || el.id === "prog-import") && el.files[0]) {
    el.files[0].text().then(t => {
      const d = JSON.parse(t);
      if (d?.format === "gymlog-program") {
        const p = cleanProgram(d); if (!p) throw new Error();
        S.program = p; useProgram(p); save(true); toast(`Loaded ${p.name || "program"}: ${WEEKS} weeks`); el.value = ""; return render();
      }
      if (el.id === "prog-import" || !d || typeof d.sessions !== "object") throw new Error();
      const keep = S.program;
      S = tidy(d); if (!S.program && keep) S.program = keep; useProgram(S.program || cleanProgram(BUILTIN));
      save(true); toast(`Restored ${Object.keys(S.sessions).length} sessions`); render();
    }).catch(() => toast(el.id === "prog-import" ? "That file isn't a Gym Log program file." : "That file isn't a Gym Log backup."));
  }
});

paintBar(); render();
loadRunna();
// The Monday ntfy reminder links here with ?weigh=1.
if (/[?&]weigh=1/.test(location.search)) { history.replaceState(null, "", location.pathname); weighSheet(); }
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
