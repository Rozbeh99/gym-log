<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Log</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0a09">
<meta name="description" content="Four lifting days and two runs a week, with swap-in exercises and a set-by-set log.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark iron room. One column of matte panels, a heat-gradient hero for today's session,
   competition-plate colours mark each training day, numbers in mono, glass tab bar. One dark theme on purpose. */
:root {
  color-scheme: dark;
  --bg: #0b0a09;
  --panel: rgba(28, 25, 22, 0.86);
  --panel-2: rgba(40, 36, 32, 0.8);
  --line: rgba(255, 220, 190, 0.09);
  --line-2: rgba(255, 220, 190, 0.18);
  --ink: #f4eee8;
  --muted: #a1958a;
  --faint: #6a6058;
  --heat: linear-gradient(120deg, #ffb238 0%, #ff6a2b 55%, #e8344a 100%);
  --on-heat: #160a05;
  --amber: #ffb238;
  --orange: #ff6a2b;
  --good: #4fd18b;
  --red: #ff5a52; --blue: #4f8dff; --yellow: #ffc93c; --green: #3fcf7a; --steel: #9aa7b4;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Manrope", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 16px;
  --tabbar: 60px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); overflow-x: hidden; max-width: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(800px 380px at 85% -140px, rgba(255, 106, 43, 0.16), transparent 70%),
    radial-gradient(600px 300px at -10% 10%, rgba(232, 52, 74, 0.07), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 28px); }
main .wrap { padding-block: 14px 0; }
section.view { display: grid; gap: 22px; }

.head { display: grid; gap: 4px; padding-top: 6px; }
.eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); }
.head h1 { font-size: 38px; line-height: 1; text-transform: uppercase; }
.head p { margin: 0; color: var(--muted); font-size: 14px; }
.label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 0 2px; display: flex; align-items: center; gap: 10px; }
.label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.group { display: grid; gap: 10px; }
.note { font-size: 13px; color: var(--muted); padding: 0 2px; line-height: 1.45; margin: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.pad { padding: 16px; }

/* Hero */
.hero { position: relative; overflow: hidden; padding: 18px 16px 16px; display: grid; gap: 16px; border: 1px solid transparent;
  background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(140deg, rgba(255,178,56,.75), rgba(255,106,43,.12) 45%, rgba(232,52,74,.6)) border-box; }
.hero::after { content: ""; position: absolute; width: 240px; height: 240px; right: -80px; top: -110px; background: radial-gradient(circle, var(--glow, rgba(255,106,43,.3)), transparent 70%); pointer-events: none; }
.hero-top { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; }
.ring .big { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1; }
.ring .cap { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-top: 3px; }
.hero .when { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--c, var(--amber)); }
.hero h2 { font-size: 34px; line-height: 1; margin-top: 4px; text-transform: uppercase; }
.hero .sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.telemetry { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.telemetry div { padding: 10px 0 10px 12px; display: grid; gap: 2px; min-width: 0; }
.telemetry div:first-child { padding-left: 0; }
.telemetry div + div { border-left: 1px solid var(--line); }
.telemetry .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.telemetry .v { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.1; }
.telemetry .v small { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 2px; }
.cta { display: block; width: 100%; text-align: center; border: 0; border-radius: 12px; padding: 15px; background: var(--heat); color: var(--on-heat); font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; box-shadow: 0 8px 30px -10px rgba(255, 106, 43, .7); }
.cta.quiet { background: var(--panel-2); color: var(--ink); box-shadow: none; border: 1px solid var(--line-2); }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { display: grid; gap: 4px; justify-items: center; padding: 9px 0 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
.wd .d { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.wd .n { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1; }
.wd .t { font-size: 10px; font-weight: 600; color: var(--muted); line-height: 1; }
.wd .bar { width: 18px; height: 3px; border-radius: 2px; background: var(--c, transparent); opacity: .35; }
.wd.done .bar { opacity: 1; box-shadow: 0 0 10px var(--c); }
.weeknav { display: flex; align-items: center; gap: 8px; }
.navbtn { width: 34px; height: 30px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); font-size: 18px; line-height: 1; color: var(--ink); }
button.wd { cursor: pointer; }
.wd.done { background: var(--panel-2); }
.wd.today { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }

/* Lists */
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 0; background: none; text-align: left; width: 100%; text-decoration: none; color: inherit; }
.row + .row { border-top: 1px solid var(--line); }
.row .stripe { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
.row .main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.row .t1 { font-weight: 600; }
.row .t2 { font-size: 13px; color: var(--muted); }
.row .end { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; flex: none; }
.chev { color: var(--faint); font-size: 18px; flex: none; }

/* Workout */
.wohead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(11,10,9,.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.wohead .wrap { display: grid; gap: 8px; padding-block: 10px; }
.wotop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { border: 0; background: none; color: var(--muted); font-weight: 600; padding: 4px 0; font-size: 15px; }
.clock { font-family: var(--mono); font-size: 14px; color: var(--muted); }
.wotitle { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.wotitle h1 { font-size: 30px; text-transform: uppercase; line-height: 1; }
.prog { height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--heat); border-radius: 2px; transition: width .3s; }
.dateline { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.dateline input { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 4px 8px; color-scheme: dark; }

.ex { padding: 16px; display: grid; gap: 12px; }
.ex.complete { border-color: rgba(79, 209, 139, .35); }
.exhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.exidx { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--c); text-transform: uppercase; }
.exname { font-size: 25px; line-height: 1.02; margin-top: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 4px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.chip b { color: var(--ink); font-weight: 600; }
.chip.good { color: var(--good); border-color: rgba(79,209,139,.35); background: rgba(79,209,139,.08); }
.swap { flex: none; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.swap svg { width: 14px; height: 14px; }
.prev { font-size: 13px; color: var(--muted); }
.prev b { color: var(--ink); font-family: var(--mono); font-weight: 500; font-size: 12.5px; }
.sets { display: grid; gap: 6px; }
.setrow, .sethead { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; }
.sethead span { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.setno { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--faint); text-align: center; }
.setrow input { width: 100%; min-width: 0; background: rgba(0,0,0,.28); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px; font-family: var(--mono); font-size: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.setrow input::placeholder { color: var(--faint); }
.setrow.on input { border-color: rgba(79,209,139,.4); background: rgba(79,209,139,.06); }
.setrow.on .setno { color: var(--good); }
.tick { height: 46px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); display: grid; place-items: center; color: var(--faint); }
.tick svg { width: 20px; height: 20px; }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #062512; box-shadow: 0 0 18px -4px var(--good); }
.mini { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { border: 1px dashed var(--line-2); background: none; border-radius: 9px; padding: 6px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
details.cue summary { font-size: 13px; color: var(--muted); cursor: pointer; list-style: none; }
details.cue summary::before { content: "+ "; color: var(--amber); }
details.cue[open] summary::before { content: "– "; }
details.cue p { margin: 6px 0 0; font-size: 14px; }
.field { display: grid; gap: 5px; }
.field label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; min-width: 0; background: rgba(0,0,0,.28); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.field input { font-family: var(--mono); }
textarea { resize: vertical; min-height: 70px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Exercise photos */
.demo { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #15120f; padding: 0; }
.demo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.demo img + img { animation: frame 2.4s steps(1, end) infinite; }
@keyframes frame { 0% { opacity: 0; } 50% { opacity: 1; } }
.demo .tag { position: absolute; left: 8px; bottom: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; background: rgba(11,10,9,.78); color: var(--ink); padding: 4px 8px; border-radius: 6px; }
.watch { font-size: 13px; font-weight: 600; color: var(--amber); text-decoration: none; }
.thumb { width: 52px; height: 40px; border-radius: 7px; object-fit: cover; flex: none; background: #15120f; border: 1px solid var(--line); }
.thumb.none { display: grid; place-items: center; color: var(--faint); font-size: 16px; }
.frames { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.frames figure { margin: 0; display: grid; gap: 4px; }
.frames img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: #15120f; }
.frames figcaption { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .demo img + img { display: none; } }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; background: #1a1714; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); justify-self: center; }
.sheet h3 { font-size: 24px; text-transform: uppercase; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 13px 14px; }
.opt[aria-pressed="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.opt .eq { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.opts { display: grid; gap: 8px; }

/* Rest timer */
.rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(20,18,16,.94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line-2); }
.rest .wrap { display: flex; align-items: center; gap: 12px; padding: 0; }
.rest .tt { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 84px; }
.rest .tl { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.rest .tl span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest.over .tt { color: var(--amber); }
.rest button { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; padding: 8px 10px; font-weight: 700; font-size: 13px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(14,12,11,.82); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tabbar button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 4px; color: var(--faint); font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; position: relative; }
.tabbar svg { width: 21px; height: 21px; }
.tabbar button[aria-current="page"] { color: var(--amber); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; width: 28px; height: 2px; border-radius: 2px; background: var(--heat); }

/* History + chart */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.select { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; color-scheme: dark; }
.hitem { padding: 14px 16px; display: grid; gap: 8px; border-left: 4px solid var(--c); }
.hitem header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hitem h4 { font-size: 22px; text-transform: uppercase; }
.hitem time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.hitem ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; }
.hitem ul span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.hbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.sbtn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 700; }
.sbtn.danger { color: var(--red); }
.empty { text-align: center; color: var(--muted); padding: 34px 16px; border: 1px dashed var(--line-2); border-radius: var(--r); font-size: 14px; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.setline { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 16px; }
.setline + .setline { border-top: 1px solid var(--line); }
.setline select { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; color-scheme: dark; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 14px); z-index: 70; background: var(--ink); color: var(--bg); font-weight: 700; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); }
.prose { display: grid; gap: 8px; }
.prose p, .prose li { margin: 0; font-size: 14px; color: var(--ink); max-width: 65ch; }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.prose b { color: var(--amber); font-weight: 600; }
.vol td { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.vol { width: 100%; border-collapse: collapse; }
.vol td:last-child { text-align: right; font-family: var(--mono); color: var(--muted); font-size: 13px; }
.summary .telemetry { margin: 4px 0; }
.pr { color: var(--amber); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main id="main"><div class="wrap" id="view"></div></main>

<div class="rest" id="rest" hidden>
  <div class="wrap">
    <div class="tt" id="rest-t">0:00</div>
    <div class="tl"><span id="rest-l">Rest</span><div class="prog"><i id="rest-bar" style="width:0"></i></div></div>
    <button type="button" id="rest-add">+30s</button>
    <button type="button" id="rest-skip">Skip</button>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <div class="wrap">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Today</button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Plan</button>
    <button type="button" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>Progress</button>

        </div>
        <div class="chip" id="pace" style="justify-self:start">${paceText(s)}</div>
        <div class="field"><label for="run-note">Notes</label><textarea id="run-note" data-run="note" placeholder="Route, weather, how the legs felt">${esc(s.note)}</textarea></div>
      </div>

      <p class="note">${d.id === "runna" ? "Copy the distance and time from Runna after your run so your whole week is in one place." : "If you follow a session in the Run 5K app that day, log the distance and time here too so your whole week is in one place."}</p>
    </section>`;
}
function paceText(s) {
  const dist = num(s.dist), t = num(s.time);
  if (!(dist > 0 && t > 0)) return "Pace shows once distance and time are in";
  const p = t / dist, m = Math.floor(p), sec = Math.round((p - m) * 60) % 60;
  return `Pace ${m}:${String(sec).padStart(2, "0")} /km`;
}

  }).join("");

    <div class="head"><div class="eyebrow">Progress</div><h1>Your log</h1></div>

    ${names.length ? `<div class="group"><div class="label">Strength trend</div><div class="panel pad" style="display:grid;gap:12px">
      <select class="select" id="hist-ex" aria-label="Exercise">${names.map(n => `<option ${n === histEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>

}
function chart(name) {
  const pts = Object.values(S.sessions).map(s => {
    const e = Object.values(s.ex || {}).find(e => e.v === name); if (!e) return null;
    let best = 0, top = null;
    for (const x of e.sets) { const v = e1rm(num(x.w), num(x.r)); if (v > best) { best = v; top = x; } }
    return best ? { date: s.date, v: best, top } : null;
  }).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
  if (!pts.length) return `<p class="note">No weights logged for this one yet.</p>`;
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 22;
  const lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = Math.max(2.5, (hi - lo) * 0.15), y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length - 1).toFixed(1)},${H - B}L${x(0).toFixed(1)},${H - B}Z`;
  const ticks = [y0, (y0 + y1) / 2, y1].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(255,220,190,.08)"/><text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`).join("");
  const last = pts[pts.length - 1], first = pts[0];
  const change = last.v - first.v;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one-rep max for ${esc(name)} over time">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a2b" stop-opacity=".35"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb238"/><stop offset="1" stop-color="#e8344a"/></linearGradient></defs>
    ${ticks}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 2.5}" fill="${i === pts.length - 1 ? "#ffb238" : "#0b0a09"}" stroke="#ff6a2b" stroke-width="1.5"/>`).join("")}
    <text x="${L}" y="${H - 6}">${fmtDate(first.date)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(last.date)}</text></svg>
    <p class="note" style="padding:0">Estimated one-rep max from your best set each session. Latest: <b style="color:var(--ink)">${Math.round(last.v)}</b> from ${esc(last.top.w)}×${esc(last.top.r)}${pts.length > 1 ? `, <span style="color:${change >= 0 ? "var(--good)" : "var(--red)"}">${change >= 0 ? "+" : ""}${change.toFixed(1)}</span> since ${fmtDate(first.date)}` : ""}.</p>`;
}

// ================= Rest timer =================
let rEnd = 0, rLen = 0, rInt = null, beeped = false, audio = null;
function startRest(sec, label) {
  rEnd = Date.now() + sec * 1000; rLen = sec * 1000; beeped = false;
  document.getElementById("rest-l").textContent = "Rest · next set of " + label;
  document.getElementById("rest").hidden = false;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
  clearInterval(rInt); restTick(); rInt = setInterval(restTick, 250);
}
function stopRest() { clearInterval(rInt); document.getElementById("rest").hidden = true; }
function restTick() {
  const left = Math.round((rEnd - Date.now()) / 1000), a = Math.abs(left);
  document.getElementById("rest-t").textContent = (left < 0 ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");
  document.getElementById("rest").classList.toggle("over", left < 0);
  document.getElementById("rest-bar").style.width = Math.min(100, Math.max(0, 100 - (rEnd - Date.now()) / rLen * 100)) + "%";
  if (left <= 0 && !beeped) { beeped = true; beep(); try { navigator.vibrate?.([200, 100, 200]); } catch {} }
}
function beep() {
  if (!audio) return;
  try { [0, .25].forEach(t => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, audio.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t + .18); o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .2); }); } catch {}
}
document.getElementById("rest-add").onclick = () => { rEnd += 30000; rLen += 30000; beeped = false; restTick(); };
document.getElementById("rest-skip").onclick = stopRest;
function tickClock() {
  const c = document.getElementById("clock"); if (!c || !open) return;
  const s = S.sessions[open]; if (!s || byId(s.day).run) return;
  if (s.end) { c.textContent = fmtDate(s.date); return; }
  const m = Math.floor((Date.now() - s.start) / 60000);
  c.textContent = m > 600 ? fmtDate(s.date) : `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} elapsed`;
}
setInterval(tickClock, 15000);

// ================= Events =================
document.addEventListener("click", ev => {
  if (ev.target.id === "scrim") return closeSheet();
  const b = ev.target.closest("[data-tab],[data-act]"); if (!b) return;
  if (b.dataset.tab) return go(b.dataset.tab);
  const a = b.dataset.act, s = open && S.sessions[open];
  switch (a) {
    case "start": return startSession(b.dataset.day, b.dataset.date);
    case "preview": closeSheet(); preview = { day: b.dataset.day, date: b.dataset.date || todayISO() }; render(); return window.scrollTo(0, 0);
    case "unpreview": preview = null; render(); return window.scrollTo(0, 0);
    case "day": return openDay(b.dataset.date, b.dataset.day);
    case "wk": ev.preventDefault(); weekOff = +b.dataset.d === 0 ? 0 : weekOff + +b.dataset.d; return render();
    case "resume": open = S.active; render(); return window.scrollTo(0, 0);
    case "open": closeSheet(); open = b.dataset.id; render(); return window.scrollTo(0, 0);
    case "close": stopRest(); open = null; preview = null; save(true); render(); return window.scrollTo(0, 0);
    case "finish": return finish(s);
    case "closesheet": return closeSheet();
    case "closesheet-home": closeSheet(); open = null; tab = "today"; render(); return window.scrollTo(0, 0);
    case "swap": return swapSheet(s, b.dataset.ex, b.dataset.day);
    case "demo": return demoSheet(b.dataset.name, b.dataset.ex);
    case "pick": {
      const ex = byId(b.dataset.day).ex.find(e => e.id === b.dataset.ex), n = b.dataset.name;
      if (n === ex.name) delete S.swaps[ex.id]; else S.swaps[ex.id] = n;
      if (s) exEntry(s, ex.id).v = n;
      save(); closeSheet(); render(); toast("Swapped to " + n); return;
    }
    case "tick": {
      const e = exEntry(s, b.dataset.ex), k = +b.dataset.k, x = e.sets[k] || (e.sets[k] = {});
      x.done = !x.done;
      if (x.done) {
        const w = document.getElementById(`w-${b.dataset.ex}-${k}`), r = document.getElementById(`r-${b.dataset.ex}-${k}`);
        if (!filled({ w: x.w }) && w.placeholder !== "–") { x.w = w.placeholder; w.value = x.w; }
        if (!x.r && /^\d+$/.test(r.placeholder)) { x.r = r.placeholder; r.value = x.r; }
        const ex = byId(s.day).ex.find(q => q.id === b.dataset.ex);
        if (!s.end) startRest(ex.rest, e.v);
      }
      b.setAttribute("aria-pressed", x.done); b.closest(".setrow").classList.toggle("on", x.done);
      b.closest(".ex").classList.toggle("complete", e.sets.every(q => q.done));
      refreshProgress(s); save(); return;
    }
    case "addset": { const e = exEntry(s, b.dataset.ex); const prev = e.sets[e.sets.length - 1] || {}; e.sets.push({ w: prev.w || "" }); save(); return render(); }
    case "rmset": { const e = exEntry(s, b.dataset.ex); e.sets.pop(); save(); return render(); }
    case "runopt": s.variant = b.dataset.name; S.swaps[s.day] = b.dataset.name; save(); return render();
    case "del": pendingDel.add(b.dataset.id); return render();
    case "delno": pendingDel.delete(b.dataset.id); return render();
    case "delyes": if (S.active === b.dataset.id) S.active = null; delete S.sessions[b.dataset.id]; pendingDel.delete(b.dataset.id); save(true); toast("Deleted"); return render();
    case "unit": S.unit = b.dataset.u; if (S.active && S.sessions[S.active] && !doneSets(S.sessions[S.active])) S.sessions[S.active].unit = S.unit; save(); return render();
    case "resetswaps": for (const k of Object.keys(S.swaps)) if (!RUNS.some(r => r.id === k)) delete S.swaps[k]; save(); toast("Back to the original exercises"); return render();
    case "export": {
      const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
      const file = new File([blob], `gym-log-${todayISO()}.json`, { type: "application/json" });
      if (navigator.canShare?.({ files: [file] })) { navigator.share({ files: [file], title: "Gym Log backup" }).catch(() => {}); return; }
      const u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = file.name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return;
    }
    case "wipe": pendingDel.add("ALL"); return render();
    case "wipeno": pendingDel.delete("ALL"); return render();
    case "wipeyes": S = { unit: "kg", schedule: DEFAULT_SCHEDULE.slice(), swaps: {}, sessions: {}, active: null }; pendingDel.delete("ALL"); save(true); toast("Everything erased"); return render();
  }
});
document.addEventListener("input", ev => {
  const el = ev.target, s = open && S.sessions[open];
  if (s && el.dataset.f) {
    const e = exEntry(s, el.dataset.ex), k = +el.dataset.k;
    (e.sets[k] || (e.sets[k] = {}))[el.dataset.f] = el.value.trim().replace(",", ".");
    return save();
  }
  if (s && el.dataset.run) { s[el.dataset.run] = el.value; const p = document.getElementById("pace"); if (p) p.textContent = paceText(s); return save(); }
  if (s && el.id === "wo-note") { s.note = el.value; return save(); }
});
document.addEventListener("change", ev => {
  const el = ev.target, s = open && S.sessions[open];
  if (s && el.id === "wo-date" && el.value) { s.date = el.value; save(); return; }
  if (el.dataset.sch !== undefined) { S.schedule[+el.dataset.sch] = el.value; save(); return; }
  if (el.id === "hist-ex") { histEx = el.value; return render(); }
  if (el.id === "import" && el.files[0]) {
    el.files[0].text().then(t => {
      const d = JSON.parse(t);
      if (!d || typeof d.sessions !== "object") throw new Error();
      S = { unit: "kg", schedule: DEFAULT_SCHEDULE.slice(), swaps: {}, sessions: {}, active: null, ...d };
      save(true); toast(`Restored ${Object.keys(S.sessions).length} sessions`); render();
    }).catch(() => toast("That file isn't a Gym Log backup."));
  }
});

render();
loadRunna();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
